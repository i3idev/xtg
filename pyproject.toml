[project]
name = "xtg"
version = "0.1.0"
description = "eXtractorT - Telegram Intelligence & Extraction Toolkit"
readme = "README.md"
authors = [{ name = "I3idro", email = "my.os.linux1@gmail.com" }]
keywords = ["telegram", "osint", "cli", "intelligence", "extraction"]
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "loguru>=0.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

# Phase 2 dependency (Telegram MTProto client). Requires network access to install:
#   uv add "telethon>=1.34"
# It is intentionally not declared yet so that Phase 1 stays installable offline;
# xtg.telegram imports it lazily inside the functions that need a live connection.

[project.scripts]
xtg = "xtg.cli.main:run"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "xtg"
module-root = ""
# Ship the bundled proxy list as package data.
source-include = ["xtg/proxy/list_proxy.json"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "strict"
filterwarnings = ["error::DeprecationWarning:xtg.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["xtg", "tests"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle
    "W",    # warnings
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "C4",   # comprehensions
    "RET",  # return
    "ARG",  # unused arguments
    "PTH",  # pathlib
    "TID",  # tidy imports
]
ignore = [
    "E501",    # line length handled by the formatter
    "SIM108",  # ternary is not always clearer
    "RET504",  # named result before return reads better here
]

[tool.ruff.lint.per-file-ignores]
# Typer's API requires function calls in argument defaults (typer.Option(...)).
"xtg/cli/commands/*.py" = ["B008"]
"tests/*" = ["ARG001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true